<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101622"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57efd5"/>
      <stop offset="1" stop-color="#62aaff"/>
    </linearGradient>
  </defs>
  <!--
    Sonora application icon (CC0, drawn for this project):
    rounded console panel with a signal-mark and a piano-roll grid.
  -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)" stroke="#263346" stroke-width="3"/>
  <g fill="url(#accent)">
    <rect x="26" y="44" width="7" height="40" rx="3.5"/>
    <rect x="38" y="34" width="7" height="60" rx="3.5"/>
    <rect x="50" y="50" width="7" height="28" rx="3.5"/>
    <rect x="62" y="28" width="7" height="72" rx="3.5"/>
    <rect x="74" y="46" width="7" height="36" rx="3.5"/>
    <rect x="86" y="38" width="7" height="52" rx="3.5"/>
  </g>
  <g fill="#b19aff" opacity="0.85">
    <rect x="26" y="94" width="20" height="8" rx="2"/>
    <rect x="52" y="94" width="28" height="8" rx="2"/>
    <rect x="86" y="94" width="16" height="8" rx="2"/>
  </g>
</svg>
